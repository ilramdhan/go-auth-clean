        name: tag
        type: string
      - description: Search in note
        in: query
        name: q
        type: string
      - description: Only csv is supported
        enum:
        - csv
        in: query
        name: format
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: INVALID_PARAMETER / INVALID_RANGE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Export transactions as CSV
      tags:
      - transactions
  /transactions/import:
    post:
      consumes:
      - multipart/form-data
      description: Multipart upload (field "file", max 5 MB / 10,000 rows) in the
        export format; account and category may be names or IDs, currency and tags
        optional (tags must exist). Rows are validated individually; possible duplicates
        (same date, amount, note and account as an earlier import) are skipped. With
        dry_run=true nothing is written. All valid rows are committed in one DB transaction.
      parameters:
      - description: CSV file
        in: formData
        name: file
        required: true
        type: file
      - description: Validate only
        in: query
        name: dry_run
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: dry run
          schema:
            $ref: '#/definitions/finance.ImportEnvelope'
        "201":
          description: imported
          schema:
            $ref: '#/definitions/finance.ImportEnvelope'
        "400":
          description: INVALID_PARAMETER / INVALID_CSV_HEADER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "413":
          description: IMPORT_TOO_LARGE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: IMPORT_TOO_MANY_ROWS / VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Import transactions from CSV
      tags:
      - transactions
  /transfers:
    get:
      description: Transfers between the user's accounts, newest first, cursor paginated.
        Transfers are not counted as income/expense in reports.
      parameters:
      - description: From date (YYYY-MM-DD)
        format: date
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        format: date
        in: query
        name: to
        type: string
      - description: Source or destination account
        format: uuid
        in: query
        name: account_id
        type: string
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from meta.next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.TransferListEnvelope'
        "400":
          description: INVALID_PARAMETER / INVALID_CURSOR / INVALID_RANGE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List transfers
      tags:
      - transfers
    post:
      consumes:
      - application/json
      description: Moves money between two of the user's accounts (same currency)
        atomically. An optional fee is recorded as an expense ("Biaya Admin") on the
        source account. Requires an Idempotency-Key header (same semantics as POST
        /transactions).
      parameters:
      - description: Unique key per logical request (8-128 chars), e.g. a UUID
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Transfer
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.CreateTransferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Idempotent-Replayed:
              description: true when the response is a replay
              type: string
          schema:
            $ref: '#/definitions/finance.TransferEnvelope'
        "400":
          description: INVALID_JSON / IDEMPOTENCY_KEY_REQUIRED / INVALID_IDEMPOTENCY_KEY
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: IDEMPOTENCY_IN_PROGRESS
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / SAME_ACCOUNT_TRANSFER / INSUFFICIENT_BALANCE
            / CURRENCY_MISMATCH / ACCOUNT_ARCHIVED / IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create transfer
      tags:
      - transfers
  /transfers/{id}:
    delete:
      description: Soft deletes the transfer (and its fee transaction) and reverts
        both legs.
      parameters:
      - description: Transfer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: TRANSFER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: VERSION_CONFLICT
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: INSUFFICIENT_BALANCE / ACCOUNT_ARCHIVED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete transfer
      tags:
      - transfers
    get:
      parameters:
      - description: Transfer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Current version, use with If-Match
              type: string
          schema:
            $ref: '#/definitions/finance.TransferEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: TRANSFER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get transfer
      tags:
      - transfers
    patch:
      consumes:
      - application/json
      description: Partial update; all affected balances (up to 4 accounts) are adjusted
        in one DB transaction. fee "0" removes the fee transaction.
      parameters:
      - description: Transfer ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Expected version, e.g. \
        in: header
        name: If-Match
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.UpdateTransferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.TransferEnvelope'
        "400":
          description: INVALID_JSON / INVALID_IF_MATCH / INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: TRANSFER_NOT_FOUND / ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: VERSION_CONFLICT
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / SAME_ACCOUNT_TRANSFER / INSUFFICIENT_BALANCE
            / CURRENCY_MISMATCH
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update transfer
      tags:
      - transfers
  /users/me:
    delete:
      consumes:
      - application/json
      description: 'Soft-deletes the account after password re-authentication: personal
        data is anonymized, all sessions are revoked, and the email can be registered
        again.'
      parameters:
      - description: Current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS / UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: ACCOUNT_LOCKED / RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete current account
      tags:
      - users
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Partial update. Only fields present in the body are changed. Email
        cannot be changed here.
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserEnvelope'
        "400":
          description: INVALID_JSON / NO_FIELDS_TO_UPDATE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INVALID_FULL_NAME
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
  /users/me/2fa:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MFAStatusEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get 2FA status
      tags:
      - 2fa
  /users/me/2fa/disable:
    post:
      consumes:
      - application/json
      description: Requires the current password AND a TOTP or recovery code. Other
        sessions are revoked.
      parameters:
      - description: Password and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.DisableMFARequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS / INVALID_MFA_CODE / UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: MFA_NOT_ENABLED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable 2FA
      tags:
      - 2fa
  /users/me/2fa/enable:
    post:
      consumes:
      - application/json
      description: Verifies the first code from the authenticator app, enables 2FA,
        and returns 10 single-use recovery codes (shown only once; stored hashed).
        Other sessions are revoked.
      parameters:
      - description: TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.MFACodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RecoveryCodesEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_MFA_CODE / UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: MFA_SETUP_REQUIRED / MFA_ALREADY_ENABLED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Confirm and enable 2FA
      tags:
      - 2fa
  /users/me/2fa/recovery-codes:
    post:
      consumes:
      - application/json
      description: Replaces all recovery codes (requires a current TOTP code). The
        new codes are shown only once.
      parameters:
      - description: TOTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.MFACodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RecoveryCodesEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_MFA_CODE / UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: MFA_NOT_ENABLED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Regenerate recovery codes
      tags:
      - 2fa
  /users/me/2fa/setup:
    post:
      description: Generates a new TOTP secret (stored encrypted, status pending)
        and returns it with an otpauth:// URI to render as a QR code. Calling again
        replaces a pending secret.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MFASetupEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: MFA_ALREADY_ENABLED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start 2FA enrollment
      tags:
      - 2fa
  /users/me/api-keys:
    get:
      description: Returns metadata of the current user's API keys (never the secret).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.APIKeyListEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - api-keys
    post:
      consumes:
      - application/json
      description: 'Creates a key in the format gac_<env>_<prefix>_<secret>. The full
        key is returned ONLY in this response; the server stores just the prefix and
        a SHA-256 hash. Send it as `X-API-Key: <key>` or `Authorization: ApiKey <key>`.'
      parameters:
      - description: Name, scopes, expiry
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.CreatedAPIKeyEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: API_KEY_LIMIT
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INVALID_API_KEY_NAME / INVALID_SCOPE /
            INVALID_EXPIRY
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API key
      tags:
      - api-keys
  /users/me/api-keys/{id}:
    delete:
      description: Revokes one of the current user's API keys immediately. Keys of
        other users return 404.
      parameters:
      - description: API key id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: API_KEY_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API key
      tags:
      - api-keys
  /users/me/identities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.IdentityListEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List linked external accounts
      tags:
      - oauth
  /users/me/identities/google/link:
    post:
      description: Returns the Google consent URL for the logged-in user and sets
        the encrypted flow cookie (call with credentials). After consent the callback
        links the identity and redirects to the frontend with ?linked=google.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.OAuthStartEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Start linking a Google account
      tags:
      - oauth
  /users/me/password:
    put:
      consumes:
      - application/json
      description: Changes the password (requires the current one). Other sessions
        are revoked; the current session stays logged in. Also available as POST.
      parameters:
      - description: Old and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS / UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / WEAK_PASSWORD / PASSWORD_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: ACCOUNT_LOCKED / RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - users
  /users/me/security-events:
    get:
      description: Audit trail of the current user's security events (logins, password
        changes, ...), newest first, cursor paginated.
      parameters:
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from meta.next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SecurityEventListEnvelope'
        "400":
          description: INVALID_CURSOR / INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List security events
      tags:
      - users
  /users/me/sessions:
    get:
      description: Returns the active device sessions of the current user, newest
        first. current=true marks the session making this request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SessionListEnvelope'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List active sessions (devices)
      tags:
      - users
  /users/me/sessions/{id}:
    delete:
      description: Revokes one of the current user's sessions. Sessions of other users
        return 404.
      parameters:
      - description: Session id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: SESSION_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a session (device)
      tags:
      - users
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    description: API key (gac_<env>_<prefix>_<secret>) dari POST /users/me/api-keys.
      Hanya untuk endpoint yang mencantumkan ApiKeyAuth.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: Type 'Bearer <token>' (access token dari /auth/login).
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
