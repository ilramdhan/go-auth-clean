        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: SESSION_INVALID / TOKEN_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Rotate refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an account with status pending_verification and emails
        a 6-digit verification code. The user must verify before logging in.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
