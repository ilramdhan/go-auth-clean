basePath: /api/v1
consumes:
- application/json
definitions:
  ErrorBody:
    properties:
      code:
        example: VALIDATION_FAILED
        type: string
      details:
        items:
          $ref: '#/definitions/FieldDetail'
        type: array
      message:
        example: input tidak valid
        type: string
    type: object
  ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/ErrorBody'
      request_id:
        example: 0192f0c1-7b3a-7c4e-9d2a-1f2e3d4c5b6a
        type: string
    type: object
  FieldDetail:
    properties:
      field:
        example: email
        type: string
      message:
        example: harus berupa email yang valid
        type: string
    type: object
  auth.APIKeyListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/auth.APIKeyResponse'
        type: array
    type: object
  auth.APIKeyResponse:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      id:
        format: uuid
        type: string
      last_used_at:
        type: string
      name:
        example: CI pipeline
        type: string
      prefix:
        example: ab12cd34
        type: string
      revoked_at:
        type: string
      scopes:
        example:
        - read
        items:
          type: string
        type: array
    type: object
  auth.AcceptedEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.AcceptedResponse'
    type: object
  auth.AcceptedResponse:
    properties:
      message:
        example: jika email terdaftar, kode telah dikirim
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        maxLength: 72
        type: string
    required:
    - new_password
    - old_password
    type: object
  auth.CreateAPIKeyRequest:
    properties:
      expires_in_days:
        description: ExpiresInDays 0/kosong = default server (90 hari). Maksimal 365.
        example: 90
        maximum: 365
        minimum: 1
        type: integer
      name:
        example: CI pipeline
        maxLength: 100
        minLength: 1
        type: string
      scopes:
        example:
        - read
        items:
          type: string
        maxItems: 2
        minItems: 1
        type: array
    required:
    - name
    - scopes
    type: object
  auth.CreatedAPIKeyEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.CreatedAPIKeyResponse'
    type: object
  auth.CreatedAPIKeyResponse:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        type: string
      expires_at:
        type: string
      id:
        format: uuid
        type: string
      key:
        example: gac_live_ab12cd34_0123456789abcdefghijABCDEFGHIJ01
        type: string
      last_used_at:
        type: string
      name:
        example: CI pipeline
        type: string
      prefix:
        example: ab12cd34
        type: string
      revoked_at:
        type: string
      scopes:
        example:
        - read
        items:
          type: string
        type: array
    type: object
  auth.DeleteAccountRequest:
    properties:
      password:
        maxLength: 72
        type: string
    required:
    - password
    type: object
  auth.DisableMFARequest:
    properties:
      code:
        example: "123456"
        maxLength: 32
        minLength: 6
        type: string
      password:
        maxLength: 72
        type: string
    required:
    - code
    - password
    type: object
  auth.EmailRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 254
        type: string
    required:
    - email
    type: object
  auth.IdentityListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/auth.IdentityResponse'
        type: array
    type: object
  auth.IdentityResponse:
    properties:
      created_at:
        type: string
      email:
        example: budi@gmail.com
        type: string
      provider:
        example: google
        type: string
    type: object
  auth.LoginEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.LoginResponse'
    type: object
  auth.LoginMFARequest:
    properties:
      code:
        example: "123456"
        maxLength: 32
        minLength: 6
        type: string
      mfa_token:
        maxLength: 2048
        type: string
    required:
    - code
    - mfa_token
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 254
        type: string
      password:
        example: Rahasia123!
        maxLength: 72
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        example: 900
        type: integer
      mfa_required:
        description: |-
          MFARequired selalu false di sini; bila 2FA aktif server membalas 200 MFAChallengeEnvelope
          (mfa_required=true + mfa_token) yang dilanjutkan ke POST /auth/login/2fa.
        example: false
        type: boolean
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        description: SessionID adalah id device session (sama dengan id di GET /users/me/sessions).
        format: uuid
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.LogoutAllRequest:
    properties:
      include_current:
        description: IncludeCurrent=true ikut mencabut sesi yang sedang dipakai.
        example: false
        type: boolean
    type: object
  auth.MFACodeRequest:
    properties:
      code:
        example: "123456"
        type: string
    required:
    - code
    type: object
  auth.MFASetupEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.MFASetupResponse'
    type: object
  auth.MFASetupResponse:
    properties:
      otpauth_uri:
        example: otpauth://totp/go-auth-clean:budi@example.com?secret=...&issuer=go-auth-clean
        type: string
      secret:
        example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
        type: string
    type: object
  auth.MFAStatusEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.MFAStatusResponse'
    type: object
  auth.MFAStatusResponse:
    properties:
      enabled:
        example: true
        type: boolean
      enabled_at:
        type: string
      pending:
        example: false
        type: boolean
      recovery_codes_remaining:
        example: 10
        type: integer
    type: object
  auth.OAuthExchangeRequest:
    properties:
      code:
        maxLength: 128
        type: string
    required:
    - code
    type: object
  auth.OAuthStartEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.OAuthStartResponse'
    type: object
  auth.OAuthStartResponse:
    properties:
      auth_url:
        example: https://accounts.google.com/o/oauth2/v2/auth?...
        type: string
    type: object
  auth.RecoveryCodesEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.RecoveryCodesResponse'
    type: object
  auth.RecoveryCodesResponse:
    properties:
      recovery_codes:
        example:
        - abcde-fghij
        - klmno-pqrst
        items:
          type: string
        type: array
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        maxLength: 512
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        example: budi@example.com
        maxLength: 254
        type: string
      full_name:
        example: Budi Santoso
        maxLength: 100
        minLength: 1
        type: string
      password:
        example: Rahasia123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  auth.ResetPasswordRequest:
    properties:
      code:
        example: "123456"
        type: string
      email:
        example: budi@example.com
        maxLength: 254
        type: string
      new_password:
        example: RahasiaBaru123!
        maxLength: 72
        minLength: 8
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  auth.RoleRequest:
    properties:
      role:
        enum:
        - user
        - admin
        example: admin
        type: string
    required:
    - role
    type: object
  auth.SecurityEventListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/auth.SecurityEventResponse'
        type: array
      meta:
        $ref: '#/definitions/pagination.PageMeta'
    type: object
  auth.SecurityEventResponse:
    properties:
      client_ip:
        example: 203.0.113.10
        type: string
      event_type:
        example: login_succeeded
        type: string
      id:
        format: uuid
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      occurred_at:
        type: string
      outcome:
        enum:
        - success
        - failure
        example: success
        type: string
      user_agent:
        example: Mozilla/5.0
        type: string
    type: object
  auth.SessionListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/auth.SessionResponse'
        type: array
    type: object
  auth.SessionResponse:
    properties:
      client_ip:
        example: 203.0.113.10
        type: string
      created_at:
        type: string
      current:
        example: true
        type: boolean
      expires_at:
        type: string
      id:
        format: uuid
        type: string
      last_used_at:
        type: string
      user_agent:
        example: Mozilla/5.0
        type: string
    type: object
  auth.TokenEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.TokenResponse'
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      session_id:
        description: SessionID adalah id device session (sama dengan id di GET /users/me/sessions).
        format: uuid
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  auth.UpdateProfileRequest:
    properties:
      full_name:
        example: Budi S.
        maxLength: 100
        minLength: 1
        type: string
    type: object
  auth.UserEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.UserListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/auth.UserResponse'
        type: array
      meta:
        $ref: '#/definitions/pagination.PageMeta'
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: budi@example.com
        type: string
      email_verified_at:
        type: string
      full_name:
        example: Budi Santoso
        type: string
      has_password:
        description: HasPassword false untuk akun yang dibuat via OAuth (belum set
          password).
        example: true
        type: boolean
      id:
        example: 0192f0c1-7b3a-7c4e-9d2a-1f2e3d4c5b6a
        format: uuid
        type: string
      last_login_at:
        type: string
      mfa_enabled:
        example: false
        type: boolean
      roles:
        description: Roles selalu memuat "user"; "admin" bila punya akses admin.
        example:
        - user
        items:
          type: string
        type: array
      status:
        enum:
        - pending_verification
        - active
        - suspended
        example: active
        type: string
      updated_at:
        type: string
    type: object
  auth.VerifyEmailEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.VerifyEmailResponse'
    type: object
  auth.VerifyEmailRequest:
    properties:
      code:
        example: "123456"
        type: string
      email:
        example: budi@example.com
        maxLength: 254
        type: string
    required:
    - code
    - email
    type: object
  auth.VerifyEmailResponse:
    properties:
      already_verified:
        example: false
        type: boolean
      verified:
        example: true
        type: boolean
    type: object
  auth.WhoAmIEnvelope:
    properties:
      data:
        $ref: '#/definitions/auth.WhoAmIResponse'
    type: object
  auth.WhoAmIResponse:
    properties:
      api_key_id:
        format: uuid
        type: string
      auth_method:
        enum:
        - access_token
        - api_key
        example: api_key
        type: string
      roles:
        example:
        - user
        items:
          type: string
        type: array
      scopes:
        example:
        - read
        items:
          type: string
        type: array
      session_id:
        format: uuid
        type: string
      user_id:
        format: uuid
        type: string
    type: object
  finance.AccountEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.AccountResponse'
    type: object
  finance.AccountListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/finance.AccountResponse'
        type: array
    type: object
  finance.AccountResponse:
    properties:
      allow_negative:
        example: true
        type: boolean
      archived:
        example: false
        type: boolean
      archived_at:
        example: "2026-09-30T10:00:00Z"
        type: string
      balance:
        example: "1465000"
        type: string
      created_at:
        example: "2026-09-30T10:00:00Z"
        type: string
      currency:
        example: IDR
        type: string
      id:
        example: 0192f0c1-7b3a-7c4e-9d2a-1f2e3d4c5b6a
        format: uuid
        type: string
      initial_balance:
        example: "1500000"
        type: string
      name:
        example: BCA
        type: string
      type:
        enum:
        - cash
        - bank
        - ewallet
        - credit_card
        example: bank
        type: string
      updated_at:
        example: "2026-09-30T10:00:00Z"
        type: string
      version:
        example: 3
        type: integer
    type: object
  finance.AddMemberRequest:
    properties:
      email:
        example: istri@example.com
        maxLength: 254
        type: string
      role:
        enum:
        - viewer
        - editor
        type: string
      user_id:
        format: uuid
        type: string
    required:
    - role
    type: object
  finance.AuditLogListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/finance.AuditLogResponse'
        type: array
      meta:
        $ref: '#/definitions/pagination.PageMeta'
    type: object
  finance.AuditLogResponse:
    properties:
      action:
        enum:
        - create
        - update
        - delete
        type: string
      actor_id:
        format: uuid
        type: string
      after:
        type: object
      before:
        description: Before/After snapshot JSON entity (null untuk create/delete).
        type: object
      created_at:
        type: string
      entity:
        enum:
        - account
        - transaction
        - transfer
        - account_member
        type: string
      entity_id:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
    type: object
  finance.BalanceDriftResponse:
    properties:
      account_id:
        format: uuid
        type: string
      cached_balance:
        example: "100000"
        type: string
      currency:
        example: IDR
        type: string
      expected_balance:
        example: "95000"
        type: string
    type: object
  finance.BillEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.BillResponse'
    type: object
  finance.BillListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/finance.BillResponse'
        type: array
    type: object
  finance.BillResponse:
    properties:
      account_id:
        format: uuid
        type: string
      amount:
        example: "450000"
        type: string
      category_id:
        format: uuid
        type: string
      created_at:
        type: string
      currency:
        example: IDR
        type: string
      frequency:
        example: monthly
        type: string
      id:
        format: uuid
        type: string
      name:
        example: Listrik PLN
        type: string
      next_due_date:
        example: "2026-10-20"
        type: string
      overdue:
        type: boolean
      remind_days_before:
        example: 3
        type: integer
      status:
        enum:
        - active
        - paused
        - done
        type: string
      updated_at:
        type: string
      version:
        example: 1
        type: integer
    type: object
  finance.BudgetEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.BudgetResponse'
    type: object
  finance.BudgetListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/finance.BudgetResponse'
        type: array
    type: object
  finance.BudgetResponse:
    properties:
      alert_threshold_pct:
        example: 80
        type: integer
      amount:
        example: "2000000"
        type: string
      category_id:
        format: uuid
        type: string
      created_at:
        type: string
      currency:
        example: IDR
        type: string
      id:
        format: uuid
        type: string
      overspent:
        example: false
        type: boolean
      period_month:
        example: 2026-10
        type: string
      progress:
        description: Progress persen pemakaian, 2 desimal.
        example: "85.00"
        type: string
      remaining:
        description: Remaining negatif = overspent.
        example: "300000"
        type: string
      spent:
        example: "1700000"
        type: string
      status:
        enum:
        - ok
        - warning
        - exceeded
        example: warning
        type: string
      updated_at:
        type: string
      version:
        example: 1
        type: integer
    type: object
  finance.CashflowEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.CashflowResponse'
    type: object
  finance.CashflowPointResponse:
    properties:
      expense:
        example: "3500000"
        type: string
      income:
        example: "10000000"
        type: string
      net:
        example: "6500000"
        type: string
      period:
        example: "2026-09-01"
        type: string
    type: object
  finance.CashflowResponse:
    properties:
      currency:
        example: IDR
        type: string
      granularity:
        enum:
        - day
        - month
        example: month
        type: string
      points:
        items:
          $ref: '#/definitions/finance.CashflowPointResponse'
        type: array
    type: object
  finance.CategoryEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.CategoryResponse'
    type: object
  finance.CategoryNodeResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/finance.CategoryResponse'
        type: array
      color:
        example: '#FF8800'
        type: string
      icon:
        example: utensils
        type: string
      id:
        example: 01920000-0000-7000-8000-000000000101
        format: uuid
        type: string
      is_system:
        example: true
        type: boolean
      name:
        example: Makan & Minum
        type: string
      parent_id:
        format: uuid
        type: string
      type:
        enum:
        - income
        - expense
        example: expense
        type: string
    type: object
  finance.CategoryReportEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.CategoryReportResponse'
    type: object
  finance.CategoryReportResponse:
    properties:
      currency:
        example: IDR
        type: string
      items:
        items:
          $ref: '#/definitions/finance.CategoryShareResponse'
        type: array
      type:
        enum:
        - income
        - expense
        example: expense
        type: string
    type: object
  finance.CategoryResponse:
    properties:
      color:
        example: '#FF8800'
        type: string
      icon:
        example: utensils
        type: string
      id:
        example: 01920000-0000-7000-8000-000000000101
        format: uuid
        type: string
      is_system:
        example: true
        type: boolean
      name:
        example: Makan & Minum
        type: string
      parent_id:
        format: uuid
        type: string
      type:
        enum:
        - income
        - expense
        example: expense
        type: string
    type: object
  finance.CategoryShareResponse:
    properties:
      category_id:
        example: 01920000-0000-7000-8000-000000000101
        format: uuid
        type: string
      name:
        example: Makan & Minum
        type: string
      percent:
        example: "35.71"
        type: string
      total:
        example: "1250000"
        type: string
    type: object
  finance.CategoryTreeEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/finance.CategoryNodeResponse'
        type: array
    type: object
  finance.ContributeRequest:
    properties:
      amount:
        example: "500000"
        maxLength: 32
        type: string
      date:
        example: "2026-10-01"
        type: string
      note:
        maxLength: 500
        type: string
      transfer_id:
        format: uuid
        type: string
    type: object
  finance.ContributionEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.ContributionResult'
    type: object
  finance.ContributionListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/finance.ContributionResponse'
        type: array
    type: object
  finance.ContributionResponse:
    properties:
      amount:
        example: "500000"
        type: string
      created_at:
        type: string
      currency:
        example: IDR
        type: string
      date:
        example: "2026-10-01"
        type: string
      goal_id:
        format: uuid
        type: string
      id:
        format: uuid
        type: string
      note:
        type: string
      transfer_id:
        format: uuid
        type: string
    type: object
  finance.ContributionResult:
    properties:
      contribution:
        $ref: '#/definitions/finance.ContributionResponse'
      goal:
        $ref: '#/definitions/finance.GoalResponse'
    type: object
  finance.ConvertEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.ConvertResponse'
    type: object
  finance.ConvertResponse:
    properties:
      from:
        $ref: '#/definitions/finance.MoneyResponse'
      to:
        $ref: '#/definitions/finance.MoneyResponse'
    type: object
  finance.CreateAccountRequest:
    properties:
      allow_negative:
        description: AllowNegative kosong = default per tipe (true untuk bank & credit_card).
        example: false
        type: boolean
      currency:
        description: Currency kosong = base currency user.
        example: IDR
        type: string
      initial_balance:
        example: "1500000"
        maxLength: 32
        type: string
      name:
        example: BCA
        maxLength: 50
        type: string
      type:
        enum:
        - cash
        - bank
        - ewallet
        - credit_card
        example: bank
