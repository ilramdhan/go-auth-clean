  /transactions:
    get:
      description: Income/expense transactions, newest first (transaction_date, id
        DESC), cursor paginated. Dates are inclusive. Repeat account_id / category_id
        for multiple values. A cursor is bound to the filter it was issued for.
      parameters:
      - description: From date (YYYY-MM-DD)
        format: date
        in: query
        name: from
        type: string
      - description: To date (YYYY-MM-DD)
        format: date
        in: query
        name: to
        type: string
      - description: Type
        enum:
        - income
        - expense
        in: query
        name: type
        type: string
      - collectionFormat: multi
        description: Account IDs
        in: query
        items:
          type: string
        name: account_id
        type: array
      - collectionFormat: multi
        description: Category IDs
        in: query
        items:
          type: string
        name: category_id
        type: array
      - description: Also match sub categories of category_id
        in: query
        name: include_children
        type: boolean
      - description: Minimum amount (major units)
        in: query
        name: min_amount
        type: string
      - description: Maximum amount (major units)
        in: query
        name: max_amount
        type: string
      - description: Currency for amount filters (default base currency)
        in: query
        name: currency
        type: string
      - description: Search in note
        in: query
        name: q
        type: string
      - description: Tag name (case-insensitive)
        in: query
        name: tag
        type: string
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from meta.next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.TransactionListEnvelope'
        "400":
          description: INVALID_PARAMETER / INVALID_CURSOR / INVALID_RANGE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INVALID_AMOUNT
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List transactions
      tags:
      - transactions
    post:
      consumes:
      - application/json
      description: 'Records income/expense and updates the account balance atomically.
        Requires an Idempotency-Key header: retrying with the same key and body returns
        the original response (header Idempotent-Replayed: true); the same key with
        a different body is rejected.'
      parameters:
      - description: Unique key per logical request (8-128 chars), e.g. a UUID
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Transaction
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            Idempotent-Replayed:
              description: true when the response is a replay
              type: string
          schema:
            $ref: '#/definitions/finance.TransactionEnvelope'
        "400":
          description: INVALID_JSON / IDEMPOTENCY_KEY_REQUIRED / INVALID_IDEMPOTENCY_KEY
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND / CATEGORY_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: IDEMPOTENCY_IN_PROGRESS
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INSUFFICIENT_BALANCE / CURRENCY_MISMATCH
            / CATEGORY_TYPE_MISMATCH / ACCOUNT_ARCHIVED / DATE_IN_FUTURE / IDEMPOTENCY_KEY_REUSED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create transaction
      tags:
      - transactions
