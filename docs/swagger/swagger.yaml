      alert_threshold_pct:
        example: 90
        maximum: 100
        minimum: 1
        type: integer
      amount:
        example: "2500000"
        maxLength: 32
        type: string
    type: object
  finance.UpdateCategoryRequest:
    properties:
      color:
        example: '#6F4E37'
        maxLength: 7
        type: string
      icon:
        example: coffee
        maxLength: 30
        type: string
      name:
        example: Kopi Susu
        maxLength: 50
        type: string
    type: object
  finance.UpdateDebtRequest:
    properties:
      counterparty:
        maxLength: 100
        type: string
      due_date:
        example: "2026-12-31"
        type: string
      note:
        maxLength: 500
        type: string
      principal:
        maxLength: 32
        type: string
    type: object
  finance.UpdateGoalRequest:
    properties:
      account_id:
        format: uuid
        type: string
      archived:
        type: boolean
      name:
        maxLength: 100
        type: string
      target:
        maxLength: 32
        type: string
      target_date:
        example: "2027-06-30"
        type: string
    type: object
  finance.UpdateMemberRequest:
    properties:
      role:
        enum:
        - viewer
        - editor
        type: string
    required:
    - role
    type: object
  finance.UpdateRateRequest:
    properties:
      rate:
        example: "16300"
        maxLength: 32
        type: string
    required:
    - rate
    type: object
  finance.UpdateRecurringRuleRequest:
    properties:
      account_id:
        format: uuid
        type: string
      amount:
        maxLength: 32
        type: string
      category_id:
        format: uuid
        type: string
      count:
        maximum: 1000
        minimum: 1
        type: integer
      end_date:
        maxLength: 10
        type: string
      frequency:
        enum:
        - daily
        - weekly
        - monthly
        - yearly
        type: string
      interval:
        maximum: 365
        minimum: 1
        type: integer
      note:
        maxLength: 255
        type: string
      start_date:
        type: string
      type:
        enum:
        - income
        - expense
        type: string
    type: object
  finance.UpdateSettingsRequest:
    properties:
      base_currency:
        example: IDR
        type: string
      timezone:
        example: Asia/Jakarta
        maxLength: 64
        type: string
      week_start:
        description: 'WeekStart: 0 = Sunday ... 6 = Saturday.'
        example: 1
        maximum: 6
        minimum: 0
        type: integer
    required:
    - base_currency
    - timezone
    - week_start
    type: object
  finance.UpdateTagRequest:
    properties:
      color:
        example: '#00AA00'
        maxLength: 7
        type: string
      name:
        example: liburan-2026
        maxLength: 40
        type: string
    type: object
  finance.UpdateTransactionRequest:
    properties:
      account_id:
        format: uuid
        type: string
      amount:
        example: "40000"
        maxLength: 32
        type: string
      category_id:
        format: uuid
        type: string
      note:
        example: Makan malam
        maxLength: 1024
        type: string
      transaction_date:
        example: "2026-09-29"
        type: string
      type:
        enum:
        - income
        - expense
        type: string
    type: object
  finance.UpdateTransferRequest:
    properties:
      amount:
        example: "450000"
        maxLength: 32
        type: string
      fee:
        example: "0"
        maxLength: 32
        type: string
      from_account_id:
        format: uuid
        type: string
      note:
        maxLength: 1024
        type: string
      to_account_id:
        format: uuid
        type: string
      to_amount:
        example: "31.25"
        maxLength: 32
        type: string
      transfer_date:
        example: "2026-09-30"
        type: string
    type: object
  finance.YearMonthResponse:
    properties:
      expense:
        example: "9000000"
        type: string
      income:
        example: "15000000"
        type: string
      month:
        example: 2026-01
        type: string
      net:
        example: "6000000"
        type: string
    type: object
  finance.YearlyEnvelope:
    properties:
      data:
        $ref: '#/definitions/finance.YearlyResponse'
    type: object
  finance.YearlyResponse:
    properties:
      currency:
        example: IDR
        type: string
      expense:
        type: string
      income:
        type: string
      months:
        items:
          $ref: '#/definitions/finance.YearMonthResponse'
        type: array
      net:
        type: string
      savings_rate:
        example: "40.00"
        type: string
      unconverted:
        description: 'Unconverted: currency tanpa kurs ke base currency (tidak ikut
          dijumlah).'
        items:
          $ref: '#/definitions/finance.CurrencyTotalsResponse'
        type: array
      year:
        example: 2026
        type: integer
    type: object
  pagination.PageMeta:
    properties:
      has_more:
        example: true
        type: boolean
      limit:
        example: 20
        type: integer
      next_cursor:
        example: eyJ0IjoiMjAyNi0wOS0zMFQwMDowMDowMFoiLCJpIjoiLi4uIn0
        type: string
    type: object
info:
  contact:
    name: Backend Team
  description: |-
    REST API untuk autentikasi (register, login, refresh token, session) dan personal finance tracker.
    Semua response sukses dibungkus {"data": ...}; list memakai {"data": [...], "meta": {...}}; error memakai {"error": {code, message, details}, "request_id"}.
    Nominal uang dikirim sebagai string desimal major unit (mis. "35000" untuk IDR, "12.34" untuk USD).
  title: Go Auth Clean API
  version: "1.0"
paths:
  /accounts:
    get:
      description: Accounts of the current user with cached balance. Archived accounts
        are hidden unless include_archived=true.
      parameters:
      - description: Include archived accounts
        in: query
        name: include_archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.AccountListEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      description: Creates a cash/bank/ewallet/credit_card account. Amounts are strings
        in major units (e.g. "1500000" IDR, "12.50" USD).
      parameters:
      - description: Account
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/finance.AccountEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: DUPLICATE_NAME
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INVALID_AMOUNT / UNSUPPORTED_CURRENCY /
            INSUFFICIENT_BALANCE
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create account
      tags:
      - accounts
  /accounts/{id}:
    delete:
      description: Soft delete. Only allowed when the account has no transactions
        or transfers; archive it otherwise.
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: ACCOUNT_HAS_TRANSACTIONS
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - accounts
    get:
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Current version, use with If-Match
              type: string
          schema:
            $ref: '#/definitions/finance.AccountEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get account
      tags:
      - accounts
    patch:
      consumes:
      - application/json
      description: Partial update. Changing initial_balance shifts the current balance
        by the same delta. Send If-Match with the version for optimistic locking.
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Expected version, e.g. \
        in: header
        name: If-Match
        type: string
      - description: Fields to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.AccountEnvelope'
        "400":
          description: INVALID_JSON / INVALID_IF_MATCH
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: VERSION_CONFLICT / DUPLICATE_NAME
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INSUFFICIENT_BALANCE / ACCOUNT_ARCHIVED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update account
      tags:
      - accounts
  /accounts/{id}/archive:
    post:
      description: Archived accounts keep their history but cannot receive new transactions
        or transfers. Idempotent.
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.AccountEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Archive account
      tags:
      - accounts
  /accounts/{id}/members:
    get:
      description: Any member may list; non-members get 404.
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.MemberListEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List account members
      tags:
      - account-members
    post:
      consumes:
      - application/json
      description: Owner only. Invite by user_id or email. viewer = read-only, editor
        = may record transactions/transfers on the account.
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Member
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.AddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/finance.MemberEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND / USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: MEMBER_EXISTS
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INVALID_ROLE
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Share account
      tags:
      - account-members
  /accounts/{id}/members/{member_id}:
    delete:
      description: Owner removes any member; a member may remove itself (leave).
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Member user ID
        format: uuid
        in: path
        name: member_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND / MEMBER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove member
      tags:
      - account-members
    patch:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Member user ID
        format: uuid
        in: path
        name: member_id
        required: true
        type: string
      - description: Role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.UpdateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.MemberEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND / MEMBER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change member role
      tags:
      - account-members
  /accounts/{id}/unarchive:
    post:
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.AccountEnvelope'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: ACCOUNT_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unarchive account
      tags:
      - accounts
  /admin/users:
    get:
      description: Keyset-paginated user list, newest first. q searches email/name
        (substring), status filters by lifecycle status.
      parameters:
      - description: Search email or name
        in: query
        name: q
        type: string
      - description: Status filter
        enum:
        - pending_verification
        - active
        - suspended
        in: query
        name: status
        type: string
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from meta.next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserListEnvelope'
        "400":
          description: INVALID_CURSOR / INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users (admin)
      tags:
      - admin
  /admin/users/{id}:
    get:
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.UserEnvelope'
        "400":
          description: INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user (admin)
      tags:
      - admin
  /admin/users/{id}/activate:
    post:
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: CANNOT_MODIFY_SELF / INVALID_STATUS_TRANSITION
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Reactivate (unlock) a suspended user (admin)
      tags:
      - admin
  /admin/users/{id}/roles:
    post:
      consumes:
      - application/json
      description: Idempotent. Granting "user" is a no-op (every user has it implicitly).
        The new role appears in the target's access token after its next refresh.
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_JSON / INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / INVALID_ROLE
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Grant a role (admin)
      tags:
      - admin
  /admin/users/{id}/roles/{role}:
    delete:
      description: Idempotent. The implicit "user" role cannot be revoked; admins
        cannot revoke their own admin role.
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Role
        enum:
        - admin
        in: path
        name: role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: CANNOT_MODIFY_SELF
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: INVALID_ROLE
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a role (admin)
      tags:
      - admin
  /admin/users/{id}/security-events:
    get:
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor from meta.next_cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.SecurityEventListEnvelope'
        "400":
          description: INVALID_CURSOR / INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a user's security events (admin)
      tags:
      - admin
  /admin/users/{id}/suspend:
    post:
      description: Sets status to suspended and revokes all of the user's sessions
        and API keys. Admins cannot suspend themselves.
      parameters:
      - description: User id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_PARAMETER
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: FORBIDDEN
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: USER_NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: CANNOT_MODIFY_SELF / INVALID_STATUS_TRANSITION
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Suspend (lock) a user (admin)
      tags:
      - admin
  /audit-logs:
    get:
      description: Changes to my accounts, transactions, transfers and members (including
        changes by members of shared accounts), newest first. Cursor-paginated.
      parameters:
      - description: Entity filter
        enum:
        - account
        - transaction
        - transfer
        - account_member
        in: query
        name: entity
        type: string
      - description: Entity ID filter
        format: uuid
        in: query
        name: entity_id
        type: string
      - description: Page size (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: next_cursor from the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/finance.AuditLogListEnvelope'
        "400":
          description: INVALID_PARAMETER / INVALID_CURSOR
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns an access token (JWT), a rotating refresh token, the device
        session id and the user profile. Unverified accounts get 403 EMAIL_NOT_VERIFIED
        (only after a correct password). If the account has 2FA enabled the response
        is instead {"data":{"mfa_required":true,"mfa_token":"...","expires_at":"..."}}
        (MFAChallengeEnvelope); continue with POST /auth/login/2fa.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: INVALID_CREDENTIALS
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: EMAIL_NOT_VERIFIED / ACCOUNT_SUSPENDED / ACCOUNT_INACTIVE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: ACCOUNT_LOCKED / RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Log in with email and password
      tags:
      - auth
  /auth/login/2fa:
    post:
      consumes:
      - application/json
      description: Second login step when /auth/login answered mfa_required=true.
        Accepts a 6-digit TOTP code or a recovery code. Failures count toward the
        account lockout. Each mfa_token (challenge) allows at most 5 attempts; after
        that it is invalidated (401 MFA_CHALLENGE_EXPIRED) and the client must log
        in again.
      parameters:
      - description: mfa_token and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: MFA_TOKEN_INVALID / INVALID_MFA_CODE / MFA_CHALLENGE_EXPIRED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: ACCOUNT_SUSPENDED / ACCOUNT_INACTIVE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: ACCOUNT_LOCKED / RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Complete login with a 2FA code
      tags:
      - auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out current session
      tags:
      - auth
  /auth/logout-all:
    post:
      consumes:
      - application/json
      description: 'Revokes every session of the current user except the current one.
        Send {"include_current": true} to also revoke the current session. Body is
        optional.'
      parameters:
      - description: Options
        in: body
        name: body
        schema:
          $ref: '#/definitions/auth.LogoutAllRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: UNAUTHENTICATED / SESSION_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out other sessions
      tags:
      - auth
  /auth/oauth/exchange:
    post:
      consumes:
      - application/json
      description: Exchanges the single-use code (valid ~60s) delivered to the frontend
        by the callback redirect. If the account has 2FA, responds with mfa_required=true
        and an mfa_token (continue with /auth/login/2fa).
      parameters:
      - description: One-time code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.OAuthExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginEnvelope'
        "400":
          description: INVALID_JSON / LOGIN_CODE_INVALID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: ACCOUNT_SUSPENDED / ACCOUNT_INACTIVE
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Exchange OAuth one-time code for tokens
      tags:
      - oauth
  /auth/oauth/google/callback:
    get:
      description: 'Browser endpoint (redirect URI registered at Google). Verifies
        state against the cookie, exchanges the code with the PKCE verifier and validates
        the id_token (signature, iss, aud, exp, nonce). Always redirects (302) to
        the frontend: login success -> <redirect>#code=<one-time code> (exchange via
        POST /auth/oauth/exchange), link success -> ?linked=google, failure -> ?error=<CODE>.
        An existing password account with the same email is never auto-linked (OAUTH_ACCOUNT_EXISTS).'
      parameters:
      - description: Authorization code
        in: query
        name: code
        type: string
      - description: State
        in: query
        name: state
        required: true
        type: string
      - description: Error from provider
        in: query
        name: error
        type: string
      responses:
        "302":
          description: Found
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Google OAuth callback
      tags:
      - oauth
  /auth/oauth/google/start:
    get:
      description: Browser endpoint. Redirects (302) to Google with state, PKCE S256
        code_challenge and nonce; these are kept in an encrypted HttpOnly cookie.
        Returns 404 when Google OAuth is not configured.
      responses:
        "302":
          description: Found
        "404":
          description: NOT_FOUND
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Start Google sign-in
      tags:
      - oauth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Always returns 202 (does not reveal whether the email exists).
        Sends a 6-digit reset code to active accounts.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.EmailRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/auth.AcceptedEnvelope'
        "400":
          description: INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Request password reset code
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Sets a new password using the reset code and revokes ALL sessions
        of the user.
      parameters:
      - description: Email, code and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: INVALID_OTP / OTP_EXPIRED / INVALID_JSON
          schema:
            $ref: '#/definitions/ErrorResponse'
        "422":
          description: VALIDATION_FAILED / WEAK_PASSWORD
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: OTP_TOO_MANY_ATTEMPTS / RATE_LIMITED
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Reset password with OTP
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a new token pair. Reusing an already
        rotated refresh token revokes the whole device session (401 TOKEN_REUSED).
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
