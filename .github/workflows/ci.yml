name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.3.0
          # Binary rilis golangci-lint di-build dengan Go lebih lama dari go.mod (1.26);
          # goinstall mem-build dari source memakai Go hasil setup-go.
          install-mode: goinstall

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: unit tests (-short, tanpa docker)
        run: go test -short -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Docker tersedia di runner ubuntu -> test integrasi (testcontainers) ikut jalan.
      - name: migrations up -> down -> up (postgres container baru)
        run: go test -count=1 -run TestMigrations_UpDownUp -v ./internal/platform/database/
      - name: test (unit + integration)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  swagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: swagger-check (regenerate + fail on drift)
        run: make swagger-check

  build:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration, swagger]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: go-auth-clean:ci
          build-args: VERSION=${{ github.sha }}
